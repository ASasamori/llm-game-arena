[project]
name = "llm-game-arena"
version = "0.1.0"
description = "Create pipeline to do evals of llms in different games"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.79.0",
    "google-genai>=1.60.0",
    "open-spiel>=1.6.10",
    "openai>=2.11.0",
    "psycopg2-binary>=2.9.11",
    "pyright>=1.1.408",
    "python-dotenv>=1.2.1",
    "redis>=7.1.0",
    "rq>=2.6.1",
    "ruff>=0.14.14",
    "sqlalchemy>=2.0.46",
    "termcolor>=3.3.0",
]

[tool.pyright]
# Ignore missing imports in CI where dependencies aren't installed
reportMissingImports = "none"
reportAttributeAccessIssue = "warning"
