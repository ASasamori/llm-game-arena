[project]
name = "llm-game-arena"
version = "0.1.0"
description = "Generate reproducible synthetic game trajectories for reinforcement learning agents"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.79.0",
    "fastapi>=0.117.1",
    "google-genai>=1.60.0",
    "open-spiel>=1.6.10",
    "openai>=2.11.0",
    "psycopg2-binary>=2.9.11",
    "pyright>=1.1.408",
    "python-dotenv>=1.2.1",
    "redis>=7.1.0",
    "rq>=2.6.1",
    "ruff>=0.14.14",
    "sqlalchemy>=2.0.46",
    "tenacity>=9.1.2",
    "termcolor>=3.3.0",
    "tiktoken>=0.11.0",
    "matplotlib>=3.10.0",
    "uvicorn>=0.36.0",
]

[tool.pyright]
# Ignore missing imports in CI where dependencies aren't installed
reportMissingImports = "none"
reportAttributeAccessIssue = "warning"

[dependency-groups]
ci = [
    "bandit[toml]>=1.8.6,<2",
    "coverage>=7.10,<8",
    "detect-secrets>=1.5,<2",
    "pip-audit>=2.9,<3",
]
