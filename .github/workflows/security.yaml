name: Security Checks

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 9 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies and CI tools
        run: |
          python -m pip install uv
          uv sync --frozen --no-install-project --group ci
          mkdir -p analytics/ci-security
      - name: Test authentication, privacy and provider boundaries
        run: uv run --group ci python scripts/test_suites.py --suite security --report analytics/ci-security/tests.json
      - name: Scan source for security defects
        if: ${{ !cancelled() }}
        run: uv run --group ci bandit -r game_arena orchestrator data utils config scripts --severity-level medium --format json --output analytics/ci-security/bandit.json
      - name: Scan the source snapshot for leaked credentials without online verification
        if: ${{ !cancelled() }}
        run: uv run --group ci python scripts/scan_secrets.py --report analytics/ci-security/secrets.json
      - name: Audit locked dependencies against current vulnerability advisories
        if: ${{ !cancelled() }}
        run: |
          uv export --frozen --group ci --no-emit-project --no-hashes --format requirements-txt --output-file analytics/ci-security/requirements.txt
          uv run --group ci pip-audit --requirement analytics/ci-security/requirements.txt --no-deps --disable-pip --progress-spinner off --format json --output analytics/ci-security/dependencies.json
      - name: Upload redacted security evidence
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-checks
          path: analytics/ci-security/
          retention-days: 14
          if-no-files-found: warn
