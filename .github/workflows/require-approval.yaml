name: Comment-Based Approval Gate

on:
  pull_request:
    types: [opened, synchronize]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  gate:
    runs-on: ubuntu-latest

    # Ensure this only runs on events related to pull requests
    if: >
      github.event.pull_request.number ||
      github.event.issue.pull_request

    steps:
      - name: Run approval logic
        uses: actions/github-script@v7
        with:
          script: |
            // Get PR number depending on event type
            const prNumber =
              context.payload.pull_request?.number ||
              context.payload.issue.number;

            // Fetch PR to get author and state
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: prNumber
            });

            const prAuthor = pr.user.login;
            console.log(`PR #${prNumber} created by: ${prAuthor}`);

            // Define approval pairs - who can approve whose PRs
            const approvalRules = {
              "ASasamori": ["Mete4"],      // ASasamori's PRs need Mete4 approval
              "Mete4": ["ASasamori"]       // Mete4's PRs need ASasamori approval
            };

            // Get allowed approvers for this PR author
            const allowedApprovers = approvalRules[prAuthor] || [];
            
            if (allowedApprovers.length === 0) {
              console.log(`No approval rules defined for author: ${prAuthor}. Skipping.`);
              return;
            }
            
            console.log(`Required approvers: ${allowedApprovers.join(", ")}`);

            const approvalPhrases = ["approved", "/approved"];

            // Fetch comments
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber
            });

            // Get the timestamp of the latest commit (head) for stale approval check
            const { data: headCommit } = await github.rest.repos.getCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: pr.head.sha
            });
            const latestCommitTime = new Date(headCommit.commit.committer.date);
            console.log(`Latest commit: ${pr.head.sha.substring(0, 7)} at ${latestCommitTime.toISOString()}`);

            // Determine if approved (only approvals AFTER latest commit count)
            const approved = comments.some(c => {
              const userOK = allowedApprovers.includes(c.user.login);
              const text = c.body.trim().toLowerCase();
              const phraseOK = approvalPhrases.includes(text);
              const commentTime = new Date(c.created_at);
              const isAfterLatestCommit = commentTime > latestCommitTime;
              if (userOK && phraseOK) {
                console.log(`Approval from ${c.user.login} at ${commentTime.toISOString()} - ${isAfterLatestCommit ? 'VALID' : 'STALE (dismissed)'}`);
              }
              return userOK && phraseOK && isAfterLatestCommit;
            });

            const isClosed = pr.state === "closed";

            if (approved) {
              console.log("PR has required approval.");

              // If PR is closed but now approved → reopen it automatically
              if (isClosed) {
                await github.rest.pulls.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: prNumber,
                  state: "open"
                });
                console.log("PR automatically reopened due to approval.");
              }

              // Nothing more to do
              return;
            }

            // If *not* approved, and PR is open → close it
            if (!isClosed) {
              console.log("PR missing approval → closing.");
              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                state: "closed"
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: `⚠️ **Missing approval** — PR closed.\n\nRequired approver(s): **${allowedApprovers.join("**, **")}**\n\nComment \`approved\` or \`/approved\` to approve..`
              });
            } else {
              console.log("PR already closed and still not approved. No action taken.");
            }