name: Chess E2E Pipeline

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chess-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: llm_game_arena
          POSTGRES_USER: arena_user
          POSTGRES_PASSWORD: arena_pass # pragma: allowlist secret -- disposable CI service credentials only
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U arena_user -d llm_game_arena"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports:
          - 56379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg2://arena_user:arena_pass@127.0.0.1:55432/llm_game_arena # pragma: allowlist secret -- disposable CI service credentials only
      REDIS_HOST: 127.0.0.1
      REDIS_PORT: "56379"
      ARENA_API_KEYS: local-dev-key # pragma: allowlist secret -- disposable CI service credentials only
      API_HOST: 127.0.0.1
      API_PORT: "8000"
      MODEL_API_MOCK_MODE: "true"
      MODEL_API_MOCK_CASE: chess_e4
      WORKER_MODE: service_long_lived
      WORKER_LOG_LEVEL: INFO
      LOG_DIR: logs/ci_e2e
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install uv
          uv sync --frozen --no-install-project

      - name: Run Chess End-to-End Smoke
        run: |
          uv run bash scripts/chess_e2e_ci.sh

      - name: Run Generic Four-Worker End-to-End Smoke
        run: |
          uv run python scripts/generic_e2e_ci.py

      - name: Upload E2E Logs
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: chess-e2e-logs
          path: logs/ci_e2e
          if-no-files-found: warn
