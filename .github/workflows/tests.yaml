name: Unit, Integration and Regression Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: ${{ matrix.suite }} tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, regression]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install locked dependencies and CI tools
        run: |
          python -m pip install uv
          uv sync --frozen --no-install-project --group ci
      - name: Run isolated mock tests with coverage
        run: |
          uv run --group ci coverage run --data-file=analytics/ci-tests/.coverage.${{ matrix.suite }} --source=game_arena,orchestrator scripts/test_suites.py --suite ${{ matrix.suite }} --report analytics/ci-tests/${{ matrix.suite }}.json
          uv run --group ci coverage xml --data-file=analytics/ci-tests/.coverage.${{ matrix.suite }} -o analytics/ci-tests/coverage-${{ matrix.suite }}.xml
      - name: Upload test results and coverage
        if: ${{ always() && env.ACT != 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tests-${{ matrix.suite }}
          path: analytics/ci-tests/
          retention-days: 14
          if-no-files-found: warn
